<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>จองโต๊ะ วิสกี้ บิสโทร (Whisky Bistro)</title>
  <!-- โหลด LINE LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: sans-serif; padding: 15px; background-color: #f8f9fa; }
    .grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; margin: 15px 0; }
    .table-btn { padding: 10px 2px; text-align: center; border: 1px solid #ddd; cursor: pointer; font-size: 11px; font-weight: bold; border-radius: 4px; }
    .available { background-color: #d4edda; color: #155724; }
    .booked { background-color: #f8d7da; color: #721c24; cursor: not-allowed; }
    .selected { background-color: #007bff; color: white; border-color: #0056b3; }
    input, button { width: 100%; padding: 10px; margin-bottom: 12px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    button#submit-btn { background-color: #28a745; color: white; font-size: 16px; border: none; cursor: pointer; }
       
    .store-map-container {
      text-align: center;
      margin: 15px 0;
    }
    .store-map {
      width: 100%;
      max-width: 600px;
      height: auto;
      border-radius: 8px;
      border: 1px solid #ddd;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      margin-bottom: 10px;
    }
  </style>
  <link rel="icon" href="data:,">
</head>
<body>
  <h2>จองโต๊ะ วิสกี้ บิสโทร (Whisky Bistro)</h2>
  
  <label>1. เลือกวันที่ต้องการจอง:</label>
  <input type="date" id="booking-date" required>

  <div class="store-map-container">
    <p style="text-align: left; font-weight: bold; margin-bottom: 5px;">แผนผังโต๊ะ:</p>
    <img src="https://lh3.googleusercontent.com/d/1X0j0uJJBmA5maadtfSBz3ZUdqYrmas3F" alt="แผนผังร้าน Whisky Bistro 1" class="store-map">
    <br>
    <img src="https://lh3.googleusercontent.com/d/1eycANA0I61r1le-nMZ1q7oKuTloWp76o" alt="แผนผังร้าน Whisky Bistro 2" class="store-map">
  </div>
  
  <label>2. เลือกหมายเลขโต๊ะ (1-130):</label>
  <div class="grid" id="tables-container"></div>

  <div id="booking-form">
    <label>3. กรอกข้อมูลการจอง:</label>
    <input type="text" id="name" placeholder="ชื่อผู้จอง" required>
    <input type="tel" id="phone" placeholder="เบอร์โทรศัพท์" required>
    <input type="time" id="time" required>
    <input type="number" id="seats" placeholder="จำนวนที่นั่ง" min="1" required>
    
    <button id="submit-btn" type="button">ยืนยันการจอง</button>
  </div>

  <script>
    // ==========================================
    // ⚙️ ส่วนตั้งค่า (CONFIG)
    // ==========================================
    const N8N_GET_URL = "https://whiskybistro.app.n8n.cloud/webhook/get-booking"; 
    const N8N_POST_URL = "https://whiskybistro.app.n8n.cloud/webhook/submit-booking";
    const LIFF_ID = "2010161564-CtzJfGrl";
    
    let selectedTable = null;
    let lineUserId = null;

    // เริ่มต้นระบบ LIFF และบังคับล็อกอินเมื่อโหลดหน้าจอ
    async function initLiff() {
      try {
        await liff.init({ liffId: LIFF_ID });
        
        // ตรวจเช็กการเข้าสู่ระบบ หากยังไม่ได้ล็อกอิน ให้เด้งไปหน้า Log-in เสมอ
        if (!liff.isLoggedIn()) {
          liff.login();
          return; 
        }
        
        // ดึงโปรไฟล์เมื่อเข้าระบบสำเร็จแล้ว
        const profile = await liff.getProfile();
        lineUserId = profile.userId;
        console.log("LINE Login Success, User ID:", lineUserId);
        
      } catch (err) {
        console.error("LIFF Init error", err);
        // [แก้ไข] กรณีเบราว์เซอร์ติดปัญหา Token เดิมหมดอายุ/ถูกยกเลิก (revoked/expired/400) ให้ทำการล้างหน่วยความจำเครื่องแล้วบังคับเข้าสู่ระบบใหม่
        const errStr = err.toString();
        if (errStr.includes("revoked") || errStr.includes("expired") || errStr.includes("400")) {
          localStorage.clear();
          sessionStorage.clear();
          liff.login();
        }
      }
    }

    // แสดงตารางว่างเมื่อโหลดหน้าเว็บครั้งแรก
    window.addEventListener('DOMContentLoaded', () => {
      renderTables([]);
    });

    // เมื่อเปลี่ยนวันที่ ให้ดึงข้อมูลโต๊ะที่จองแล้วจาก n8n
    document.getElementById('booking-date').addEventListener('change', async (e) => {
      const date = e.target.value;
      if (!date) return;
      
      const container = document.getElementById('tables-container');
      container.innerHTML = `<div style="grid-column: span 10; text-align: center; padding: 20px; color: #666;">⏳ กำลังตรวจสอบสถานะโต๊ะสำหรับวันที่ ${date}...</div>`;
      selectedTable = null;

      try {
        const res = await fetch(`${N8N_GET_URL}?date=${date}`);
        if (!res.ok) throw new Error("API Network Error: " + res.status);
        
        // [แก้ไขฝั่ง GET] อ่านข้อความเป็นข้อความดิบก่อนเพื่อป้องกันการแครชแบบ JSON
        const responseText = await res.text();
        let bookedTables = [];

        if (responseText) {
          try {
            const rawData = JSON.parse(responseText);
            let listToParse = rawData;
            
            if (rawData && typeof rawData === 'object' && !Array.isArray(rawData)) {
              listToParse = rawData.data || rawData.booked || rawData.tables || rawData.result || [rawData];
            }

            if (Array.isArray(listToParse)) {
              bookedTables = listToParse.map(item => {
                if (typeof item === 'object' && item !== null) {
                  return Number(item.table || item.tableNumber || item.table_number || item.table_id);
                }
                return Number(item);
              }).filter(num => !isNaN(num) && num > 0); 
            }
          } catch(jsonErr) {
            console.warn("ไม่สามารถแปลงข้อมูลแบบ JSON ได้ (อาจเป็นเพราะไม่มีโต๊ะที่ถูกจอง):", jsonErr);
          }
        }
        
        renderTables(bookedTables);
      } catch (err) {
        console.warn("ไม่สามารถดึงข้อมูลจาก n8n ได้ (หน้าเว็บจะแสดงโต๊ะว่างทั้งหมดสำหรับการทดสอบ):", err);
        renderTables([]);
      }
    });

    // วาดปุ่มโต๊ะ 1-130 ลงบนหน้าจอ
    function renderTables(bookedTables) {
      const container = document.getElementById('tables-container');
      container.innerHTML = '';
      selectedTable = null;
      
      for (let i = 1; i <= 130; i++) {
        const btn = document.createElement('div');
        btn.innerText = i;
        btn.classList.add('table-btn');
        
        if (Array.isArray(bookedTables) && bookedTables.includes(i)) {
          btn.classList.add('booked');
        } else {
          btn.classList.add('available');
          btn.addEventListener('click', () => {
            document.querySelectorAll('.table-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            selectedTable = i;
          });
        }
        container.appendChild(btn);
      }
    }

    // กดปุ่มยืนยันการจอง
    document.getElementById('submit-btn').addEventListener('click', async () => {
      const date = document.getElementById('booking-date').value;
      const name = document.getElementById('name').value;
      const phone = document.getElementById('phone').value;
      const time = document.getElementById('time').value;
      const seats = document.getElementById('seats').value;

      if (!date) { alert('กรุณาเลือกวันที่ต้องการจอง'); return; }
      if (!selectedTable) { alert('กรุณาเลือกโต๊ะที่ต้องการจอง'); return; }
      if (!name || !phone || !time || !seats) { alert('กรุณากรอกข้อมูลให้ครบถ้วน'); return; }

      // ระบบการล็อกอินสำรองกรณีหลุดระบบขณะกรอกฟอร์ม
      if (!liff.isLoggedIn()) {
        liff.login();
        return;
      }

      // ดึงค่า userId ด้วยวิธีสำรองเพื่อป้องกันค่าว่างอย่างเด็ดขาด
      let finalUserId = lineUserId;
      if (!finalUserId) {
        try {
          const context = liff.getContext();
          if (context && context.userId) {
            finalUserId = context.userId;
          }
        } catch (e) {
          console.error("ดึง Context สำรองล้มเหลว", e);
        }
      }

      const payload = {
        userId: finalUserId || "guest_test", 
        date,
        table: selectedTable,
        name,
        phone,
        time,
        seats
      };

      try {
        const res = await fetch(N8N_POST_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        // [แก้ไขฝั่ง POST] อ่านข้อความเป็นข้อความดิบก่อนเพื่อป้องกันการแครช
        const responseText = await res.text();

        if (!res.ok) {
          throw new Error("HTTP Status Error: " + res.status + " | " + responseText);
        }

        let result = {};
        if (responseText) {
          try {
            result = JSON.parse(responseText);
          } catch(e) {
            result = { success: true, message: responseText };
          }
        } else {
          result = { success: true };
        }
        
        if (result.success || result.status === "success" || result.ok === true || responseText.includes("received")) {
          alert('จองโต๊ะสำเร็จ! กรุณาตรวจสอบใบยืนยันในแชต LINE');
          if (liff.isInClient()) {
            liff.closeWindow(); 
          }
        } else {
          const customError = result.message || 'ขออภัย โต๊ะนี้เพิ่งถูกจองไปเมื่อสักครู่ กรุณาเลือกโต๊ะอื่นครับ';
          alert(customError);
        }
      } catch (err) {
        console.error("Submit Error:", err);
        alert(
          'เกิดข้อผิดพลาดในการเชื่อมต่อเซิร์ฟเวอร์\n\n' +
          `รายละเอียดข้อผิดพลาด: ${err.message}`
        );
      }
    });

    initLiff();
  </script>
</body>
</html>
