<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ใช้งาน e-Voucher - Whisky Bistro Lamphun</title>

  <!-- Favicon -->
  <link class="favicon" rel="icon" type="image/x-icon" href="./favicon.ico">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@100..900&display=swap" rel="stylesheet">
  
  <!-- Google Material Symbols Outlined -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

  <!-- LINE LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    :root {
      --bg-color: #fbf9f6; /* สีครีม มินิมอล */
      --text-color: #4e463f;
      --border-color: #e8e2da;
      --accent-color: #ba7c72;
      --card-bg: rgba(255, 255, 255, 0.94);
      --primary-dark: #2d2621;
      --line-green: #eaf6f0;
      --line-green-border: #bce2d2;
      --badge-bg: #fcf6ec;
      --badge-border: #ebdcb9;
      --badge-text: #a0783c;
    }

    body, button, input, select, textarea { 
      font-family: 'Noto Sans Thai', sans-serif; 
    }
    
    body { 
      padding: 0; 
      margin: 0;
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      position: relative;
      overflow-x: hidden;
    }

    /* ภาพพื้นหลังหลักเฉพาะบริเวณส่วนบน */
    .bg-top-cover {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 380px;
      background-image: url('https://drive.google.com/thumbnail?id=1Vlm-bNpRpnUjIN55qGDjrVsR40q2QcWW&sz=w1600');
      background-size: cover;
      background-position: center top;
      opacity: 0.85;
      z-index: -2;
      mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 60%, rgba(0,0,0,0) 100%);
      -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 60%, rgba(0,0,0,0) 100%);
    }
    
    .bg-top-cover::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(to bottom, rgba(0, 0, 0, 0.6) 0%, rgba(0, 0, 0, 0.15) 100%);
      z-index: -1;
    }

    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      vertical-align: middle;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    .container-layout {
      width: 100%;
      max-width: 440px;
      padding: 30px 16px 20px 16px;
      box-sizing: border-box;
      z-index: 1;
    }

    /* ส่วนหัวแบรนด์ */
    .header-banner {
      text-align: center;
      margin-bottom: 24px;
    }

    .center-logo {
      display: block;
      margin: 0 auto 12px auto;
      max-width: 80px; 
      width: 22%;
      filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.5));
    }

    .brand-title {
      font-size: 26px;
      font-weight: 800;
      color: #ffffff; 
      margin: 0 0 4px 0;
      letter-spacing: -0.5px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7);
    }

    .brand-subtitle {
      font-size: 13px;
      color: #f5f3ed;
      margin: 0;
      line-height: 1.5;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.6);
    }

    /* การ์ดฟอร์มการใช้งาน e-Voucher */
    .voucher-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 26px 22px;
      box-sizing: border-box;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      backdrop-filter: blur(6px);
      text-align: center;
    }

    .card-heading {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 18px;
      font-weight: 800;
      color: var(--primary-dark);
      margin-bottom: 18px;
    }

    .card-heading .material-symbols-outlined {
      color: var(--accent-color);
      font-size: 24px;
    }

    /* กรอบแสดงข้อมูลผู้ใช้ LINE */
    .user-info-box {
      background-color: var(--bg-color);
      border: 1px dashed var(--border-color);
      padding: 12px 14px;
      border-radius: 10px;
      margin-bottom: 22px;
      font-size: 13px;
      color: #6a6158;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      word-break: break-all;
    }

    .user-info-header {
      display: flex;
      align-items: center;
      gap: 5px;
      font-weight: 700;
      color: var(--text-color);
      font-size: 12px;
    }

    .user-id-text {
      font-family: monospace;
      font-size: 12px;
      color: #8c7f73;
    }

    /* จัดสไตล์ฟอร์มกรอกจำนวนเงิน */
    .form-group {
      margin-bottom: 22px;
      text-align: left;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-color);
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper input {
      width: 100%;
      padding: 14px 45px 14px 16px;
      background: #ffffff;
      border: 1.5px solid var(--border-color);
      border-radius: 10px;
      font-size: 20px;
      font-weight: 700;
      color: var(--primary-dark);
      box-sizing: border-box;
      outline: none;
      transition: all 0.2s ease;
      text-align: center;
    }

    .input-wrapper input:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 3px rgba(186, 124, 114, 0.15);
    }

    .currency-suffix {
      position: absolute;
      right: 16px;
      font-size: 14px;
      font-weight: 800;
      color: #9c9186;
      pointer-events: none;
    }

    /* ปุ่มยืนยัน */
    .btn-submit {
      width: 100%;
      background-color: var(--primary-dark);
      color: #ffffff;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(45, 38, 33, 0.2);
      transition: all 0.2s ease;
    }

    .btn-submit:hover:not(:disabled) {
      background-color: #1a1512;
      transform: translateY(-1px);
    }

    .btn-submit:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn-submit:disabled {
      background-color: #cfc8c0;
      color: #8c837a;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    /* กล่องข้อความแจ้งเตือนสถานะ */
    #status {
      margin-top: 16px;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.5;
      min-height: 20px;
    }

    .footer {
      text-align: center;
      font-size: 11px;
      color: #a3998f;
      margin-top: 20px;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <!-- ภาพพื้นหลังหลักเฉพาะบริเวณส่วนบน -->
  <div class="bg-top-cover"></div>

  <div class="container-layout">
    
    <!-- แบนเนอร์หัวเว็บไซต์ -->
    <header class="header-banner">
      <img src="https://drive.google.com/thumbnail?id=1_yovqJsbiPRpoa5Mnr6GL6nmUsHXEJmp&sz=w1000" alt="Whisky Bistro Logo" class="center-logo">
      <h1 class="brand-title">Whisky Bistro</h1>
      <p class="brand-subtitle">ระบบใช้สิทธิ์ e-Voucher บัตรกำนัลส่วนลด</p>
    </header>

    <!-- การ์ดฟอร์มการหัก e-Voucher -->
    <main class="voucher-card">
      <div class="card-heading">
        <span class="material-symbols-outlined">redeem</span>
        <span>ใช้งาน e-Voucher</span>
      </div>
      
      <!-- ส่วนแสดงข้อมูล LINE User -->
      <div class="user-info-box">
        <div class="user-info-header">
          <span class="material-symbols-outlined" style="font-size: 15px; color: var(--accent-color);">account_circle</span>
          <span>ข้อมูลบัญชีผู้ใช้ LINE</span>
        </div>
        <span class="user-id-text" id="userId">กำลังเชื่อมต่อ LINE...</span>
      </div>

      <div class="form-group">
        <label class="form-label" for="amount">จำนวนเงินที่ต้องการหักชำระ</label>
        <div class="input-wrapper">
          <input type="number" id="amount" placeholder="0.00" min="1" step="any" required>
          <span class="currency-suffix">บาท</span>
        </div>
      </div>

      <button id="btnSubmit" class="btn-submit" onclick="sendDataToN8n()" disabled>
        <span class="material-symbols-outlined" style="font-size: 18px;">verified</span>
        <span>ยืนยันการหักเงิน</span>
      </button>

      <div id="status"></div>
    </main>

    <!-- ท้ายหน้า -->
    <footer class="footer">
      © 2026 WHISKY BISTRO CO., LTD. All rights reserved.
    </footer>

  </div>

  <script>
    // ⚠️ ใส่ข้อมูลตั้งค่าของคุณที่นี่
    const LIFF_ID = 'YOUR_LINE_LIFF_ID'; // นำมาจาก LINE Developers Console
    const N8N_WEBHOOK_URL = 'YOUR_N8N_WEBHOOK_URL'; // นำมาจาก Webhook Node ใน n8n

    let currentUserId = '';

    // เริ่มการทำงานของ LINE LIFF
    async function initLiff() {
      try {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) {
          liff.login();
        } else {
          const profile = await liff.getProfile();
          currentUserId = profile.userId;
          
          // แสดงชื่อโปรไฟล์ และ User ID เพื่อความชัดเจน
          const displayName = profile.displayName ? `(${profile.displayName}) ` : '';
          document.getElementById('userId').innerText = `${displayName}${currentUserId}`;
          document.getElementById('btnSubmit').disabled = false;
        }
      } catch (error) {
        console.error('LIFF Initialization failed', error);
        const statusDiv = document.getElementById('status');
        statusDiv.innerText = '⚠️ เกิดข้อผิดพลาดในการเชื่อมต่อ LINE กรุณาลองใหม่อีกครั้ง';
        statusDiv.style.color = '#c0392b';
      }
    }

    // ฟังก์ชันยิงข้อมูลไปที่ n8n workflow
    async function sendDataToN8n() {
      const amountInput = document.getElementById('amount');
      const amount = amountInput.value;
      const statusDiv = document.getElementById('status');
      const btn = document.getElementById('btnSubmit');

      if (!amount || parseFloat(amount) <= 0) {
        alert('กรุณากรอกจำนวนเงินที่ถูกต้อง');
        amountInput.focus();
        return;
      }

      btn.disabled = true;
      btn.innerHTML = `<span class="material-symbols-outlined" style="font-size: 18px; animation: spin 1s infinite linear;">sync</span> <span>กำลังประมวลผล...</span>`;
      statusDiv.innerText = 'กำลังส่งข้อมูลไปยังระบบ...';
      statusDiv.style.color = '#7a7065';

      try {
        const response = await fetch(N8N_WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            lineUserId: currentUserId,
            amountDeduct: parseFloat(amount),
            timestamp: new Date().toISOString()
          })
        });

        if (response.ok) {
          statusDiv.innerHTML = '✅ บันทึกรายการสำเร็จ! กรุณาตรวจสอบยอดเงินใน LINE';
          statusDiv.style.color = '#27523f';
          amountInput.value = '';
          btn.innerHTML = `<span class="material-symbols-outlined" style="font-size: 18px;">check_circle</span> <span>ทำรายการเสร็จสิ้น</span>`;
          
          // ปิดหน้าต่าง LIFF อัตโนมัติหลังจากสำเร็จ 2 วินาที
          setTimeout(() => { 
            if (liff.isInClient()) {
              liff.closeWindow(); 
            }
          }, 2000);
        } else {
          throw new Error('Network response was not ok');
        }
      } catch (error) {
        console.error('Error sending data to n8n:', error);
        statusDiv.innerHTML = '❌ เกิดข้อผิดพลาดในระบบหลังบ้าน กรุณาลองใหม่อีกครั้ง';
        statusDiv.style.color = '#c0392b';
        btn.disabled = false;
        btn.innerHTML = `<span class="material-symbols-outlined" style="font-size: 18px;">verified</span> <span>ยืนยันการหักเงิน</span>`;
      }
    }

    // เรียกใช้งานเมื่อเปิดหน้าเว็บ
    initLiff();
  </script>

</body>
</html>
